name: smartteach

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
      MSSQL_PID: Developer
    ports:
      # Host port defaults to 14333 so it does not clash with a locally installed SQL Server on 1433.
      - "127.0.0.1:${DB_PORT:-14333}:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  # One-shot job: creates the app database. Flyway (run by the backend) creates the tables.
  # The collation is set per database: setting MSSQL_COLLATION server-wide breaks sp_getapplock,
  # which Flyway needs, on the Linux image.
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    entrypoint:
      - /bin/sh
      - -c
      - >-
        /opt/mssql-tools18/bin/sqlcmd -C -S db -U sa -P "$$MSSQL_SA_PASSWORD" -b
        -Q "IF DB_ID('smartteach') IS NULL CREATE DATABASE smartteach COLLATE Vietnamese_100_CI_AS"
    restart: "no"

volumes:
  mssql-data:
