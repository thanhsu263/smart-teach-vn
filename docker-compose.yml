name: smartteach

services:
  db:
    image: postgres:18-alpine
    environment:
      # POSTGRES_DB makes the image create the app database on first start; Flyway creates the tables.
      POSTGRES_DB: smartteach
      POSTGRES_USER: smartteach
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18 images keep data in a versioned folder under /var/lib/postgresql.
      - pg-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartteach -d smartteach"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  # Backend in a container, with demo data. Started only with: docker compose --profile app up -d --build
  # (plain `docker compose up -d` still starts just the database, for running the backend from the IDE).
  backend:
    profiles: [app]
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/smartteach
      DB_USERNAME: smartteach
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      SPRING_PROFILES_ACTIVE: demo
      DEMO_EMAIL: ${DEMO_EMAIL:-demo@smartteach.vn}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
    ports:
      - "127.0.0.1:${SERVER_PORT:-8080}:8080"

volumes:
  pg-data:
