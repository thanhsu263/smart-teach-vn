app:
  auth:
    # Test-only key so CI does not need a JWT_SECRET variable.
    jwt-secret: test-only-jwt-secret-not-used-anywhere-else-0123456789
  metrics:
    password: test-metrics-password
  # The suite registers many users from 127.0.0.1; RateLimitIntegrationTest switches it back on.
  rate-limit:
    enabled: false
  mail:
    # Tests send queued mails themselves (IntegrationTest.sendQueuedMails), never in the background.
    outbox-delay: 1h
  jobs:
    # Never fires during a test run; tests call AssignmentDeadlineJob.run() directly.
    deadline-initial-delay: 24h
    deadline-interval: 24h

spring:
  jpa:
    properties:
      hibernate:
        # Lets tests count SQL statements (N+1 checks).
        generate_statistics: true

logging:
  level:
    # Statistics would otherwise log a summary after every session.
    org.hibernate.engine.internal.StatisticalLoggingSessionEventListener: WARN
