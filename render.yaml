# Render Blueprint for the backend (Dashboard → New → Blueprint → pick this repo).
# Values marked "sync: false" are secrets: Render asks for them when the Blueprint is created,
# they are never stored in this file.
services:
  - type: web
    name: smartteach-api
    runtime: docker
    plan: free
    # Same region as the Neon PostgreSQL database (Singapore) to keep queries fast.
    region: singapore
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    # Liveness does not touch the database, so a database that is waking up does not
    # make Render restart the service.
    healthCheckPath: /actuator/health/liveness
    buildFilter:
      paths:
        - backend/**
    envVars:
      # demo: recreate the demo data on start; prod: JSON logs.
      - key: SPRING_PROFILES_ACTIVE
        value: demo,prod
      # jdbc:postgresql://<host>/<db>?sslmode=require (Neon's direct host, not the "-pooler" one)
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # The Vercel URL of the frontend, e.g. https://smart-teach-vn.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # Browsers reach the API through Vercel's /api rewrite (same site), so Lax is enough.
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: AUTH_COOKIE_SAME_SITE
        value: Lax
      # A suspended free database takes a few seconds to wake up: keep retrying at startup.
      - key: SPRING_FLYWAY_CONNECTRETRIES
        value: "10"
      # Free Neon has 100 compute-hours a month and suspends after 5 idle minutes, but any open
      # connection keeps it running. Let Hikari close idle connections so the database can sleep.
      - key: SPRING_DATASOURCE_HIKARI_MINIMUMIDLE
        value: "0"
      - key: SPRING_DATASOURCE_HIKARI_IDLETIMEOUT
        value: "60000"
      - key: SPRING_DATASOURCE_HIKARI_MAXIMUMPOOLSIZE
        value: "5"
      - key: DEMO_EMAIL
        value: demo@smartteach.vn
      - key: DEMO_PASSWORD
        sync: false
      # Password reset mails. Render's free plan blocks outgoing SMTP, so mail goes through
      # Brevo's HTTPS API; MAIL_FROM must be a sender verified in Brevo.
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      # Base of the link in the reset mail.
      - key: APP_FRONTEND_URL
        value: https://smart-teach-vn.vercel.app
      # HTTP Basic password of the "prometheus" user for /actuator/prometheus (empty = closed).
      - key: METRICS_PASSWORD
        sync: false
